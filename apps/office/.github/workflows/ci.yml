name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: office
          POSTGRES_PASSWORD: office
          POSTGRES_DB: office
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U office"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OFFICE_TEST_POSTGRES_URL: postgresql://office:office@127.0.0.1:5432/office
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          working-directory: api
      - run: uv sync --locked
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  sandbox-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: SlavaPush/vibe-chat
          path: vibe-chat-src
      - run: docker build -t back-office-sandbox docker/sandbox
      - run: docker run --rm -v "$PWD/vibe-chat-src/web:/src:ro" back-office-sandbox sandbox-smoke /src
