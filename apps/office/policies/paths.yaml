max_file_bytes: 204800
max_list_entries: 500

deny:
  - apps/office/**
  - apps/chat/api/**
  - apps/chat/contracts/**
  - apps/chat/infra/**
  - .git
  - .git/**
  - .github/**
  - "**/.env*"
  - "**/package.json"
  - "**/package-lock.json"
  - "**/npm-shrinkwrap.json"
  - "**/yarn.lock"
  - "**/pnpm-lock.yaml"
  - "**/bun.lock"
  - "**/bun.lockb"
  - "**/uv.lock"
  - "**/pyproject.toml"
  - "**/Dockerfile"
  - "**/docker-compose*.yml"
  - apps/chat/web/vite.config.*
  - apps/chat/web/vitest.config.*
  - apps/chat/web/tsconfig*.json
  - apps/chat/web/components.json
  - apps/chat/web/.oxlintrc.json
  - apps/chat/web/scripts/**
  - apps/chat/web/src/api/**
  - apps/chat/web/src/mocks/**
  - apps/chat/web/src/test/**
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/migrations/**"

read_deny:
  - .git
  - .git/**
  - "**/.env*"

roles:
  developer:
    write:
      - apps/chat/web/src/**
      - apps/chat/web/public/**
      - apps/chat/web/index.html
    extensions: [.ts, .tsx, .css, .json, .svg, .md, .html]
  qa:
    write:
      - apps/chat/web/e2e/office/**/*.pw.ts
    extensions: [.ts]
