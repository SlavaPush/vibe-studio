name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vibe
          POSTGRES_PASSWORD: vibe
          POSTGRES_DB: vibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vibe:vibe@127.0.0.1:5432/vibe_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          working-directory: api
      - run: uv sync --locked
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vibe
          POSTGRES_PASSWORD: vibe
          POSTGRES_DB: vibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f infra/Dockerfile -t vibe-chat:ci .
      - run: >-
          docker run -d --name vibe-chat --network host
          -e PORT=10000 -e APP_VERSION=ci-check
          -e DATABASE_URL=postgresql://vibe:vibe@127.0.0.1:5432/vibe
          vibe-chat:ci
      - run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:10000/healthz && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:10000/healthz | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:10000/ | grep -q '<meta name="app-version" content="ci-check"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/api/unknown)" = "404"
          test "$(docker run --rm vibe-chat:ci id -u)" != "0"
      - if: failure()
        run: docker logs vibe-chat
