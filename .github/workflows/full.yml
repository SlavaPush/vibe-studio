name: Full CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chat/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vibe
          POSTGRES_PASSWORD: vibe
          POSTGRES_DB: vibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vibe:vibe@127.0.0.1:5432/vibe_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          working-directory: apps/chat/api
      - run: uv sync --locked
      - run: uv run pytest

  office-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/office/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: office
          POSTGRES_PASSWORD: office
          POSTGRES_DB: office
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U office"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OFFICE_TEST_POSTGRES_URL: postgresql://office:office@127.0.0.1:5432/office
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          working-directory: apps/office/api
      - run: uv sync --locked
      - run: uv run pytest

  office-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/office/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/office/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  office-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git update-ref refs/heads/main HEAD
      - run: test "$(git rev-parse refs/heads/main)" = "$(git rev-parse HEAD)"
      - run: docker build -t back-office-sandbox:p4 apps/office/docker/sandbox
      - run: >-
          docker run --rm -v "$PWD/apps/chat/web:/src:ro" -v "$PWD/apps/chat/contracts:/work/contracts:ro"
          back-office-sandbox:p4 sandbox-smoke /src
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          working-directory: apps/office/api
      - run: uv sync --locked
        working-directory: apps/office/api
      - run: uv run pytest -m docker
        working-directory: apps/office/api
        env:
          OFFICE_TEST_DOCKER: "1"
          OFFICE_TEST_TARGET_REPO: ${{ github.workspace }}
